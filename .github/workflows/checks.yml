name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/org.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:roadmap
      - run: npm run test:feedback
      - run: npm run test:feedback-pipeline
      - run: npm run test:skill-frontmatter
      - run: npm run validate:skill-frontmatter
      - run: npm run build
